<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
</head>

<body>
    <header>
        <h1>Battleship</h1>
        <button id="new-game-btn">New Game</button>
    </header>
    <main>
        <p id="instruction" class="info-text">Click New Game to start a new game</p>
        <div id="play-zone" class="play-zone">
            <div>
                <div id="human-board" class="board"></div>
                <p class="info-text">Human player</p>
            </div>
            <div>
                <div id="computer-board" class="board"></div>
                <p class="info-text">Computer player</p>
            </div>
        </div>
        <button id="next-turn-btn">Next</button>
    </main>
</body>

</html>
